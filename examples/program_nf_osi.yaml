# PROGRAM instance — NF-OSI (NF Data Portal). SCDM-35.
#
# ALTERNATIVE CONCEPTUALIZATION. This file models the entire NF effort as a single umbrella
# PROGRAM. The competing draft models NF PROGRAMs at the portal's "initiative" level, giving
# one record per multi-study consortium. Only one of the two should land.
#
# Case for this shape:
#   - Matches the Example Data table on the Entity: PROGRAM page, which came from the DMG
#     source-of-truth exercise (Oct 2025) and lists exactly one NF row: program.nf-osi.
#   - One record per portal keeps PROGRAM counts comparable across the portfolio, where
#     other portals are also represented by a single program.
#   - Populates immediately with no per-initiative curation, and the portal's 31 initiatives
#     can attach later as PROJECTs or as a sub-program grouping.
#
# Case against:
#   - NF-OSI is the data-coordination effort — the collective name for Sage plus
#     collaborators supporting the portal and community. Typing it as PROGRAM conflates a
#     DCC with a scientific research program, which is the same error the PROGRAM spec
#     already corrected for ELITE, ARK, and CCKP (portals mislabelled as programs).
#   - Collapses all NF science into one record, so competency questions the CDM exists to
#     answer — "which programs use spatial transcriptomics?", "which programs are active vs
#     completed?" — cannot discriminate within NF at all. Synodos for NF2 concluded in 2018
#     while the GFF Gene Therapy Initiative is ongoing; a single `status` cannot say both.
#   - `funding_source` becomes the union of every funder that ever supported the portal,
#     losing which funder backed which science.
#
# Values compiled from the NF Data Portal Documentation "About" page (Confluence, space NPD).
#
# Validate with:
#   linkml-validate -s src/sage_cdm.yaml -C Program examples/program_nf_osi.yaml
id: program.nf-osi
name: NF-OSI
description: >-
  The NF Open Science Initiative (NF-OSI) is the collective effort through which Sage
  Bionetworks and its collaborators support open science in the neurofibromatosis research
  community, including the NF Data Portal. It covers NF1, NF2-related schwannomatosis, and
  other forms of schwannomatosis, and hosts data generated by multiple collaborative research
  programs. Children's Tumor Foundation and NTAP participation dates back to 2014, with the
  Gilbert Family Foundation, DHART SPORE, and the CDMRP Neurofibromatosis Research Program
  joining later. Anyone in the NF research community can join.
status: active
funding_source:
  - org.ctf
  - org.ntap
  - org.gff
  - org.helmsley-charitable-trust
source: NF Data Portal Documentation, About page (Confluence space NPD)
source_url: https://help.nf.synapse.org/NFdocs/about
# CTF grants CTF-2018-04-002, CTF-2021-04-006, and 2025-04-007, NTAP, GFF, and Helmsley
# 2018PG-HPL007 support the portal. Grant numbers are deliberately not recorded: PROGRAM has
# no grant_number slot, and the spec places grant-level detail on a future GRANT entity.
#
# Note that these funders support the PORTAL and the coordination effort. Whether they are
# the correct `funding_source` for a PROGRAM record is part of what makes this shape
# questionable — see the case against, above.
