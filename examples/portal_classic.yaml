id: portal.classic
name: CLASSIC Portal
description: >-
  The CLASSIC Portal supports the Consortium for Longitudinal Behavioral and
  Social Science Data Integration and Coordination (CLASSIC), an NIH-funded
  initiative that facilitates collaboration among deeply phenotyped
  longitudinal studies of aging. The portal provides researchers with access
  to CLASSIC study information, metadata, and data resources.
